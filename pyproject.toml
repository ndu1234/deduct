[project]
name = "deduct"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.12.1",
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
deduct = "deduct.cli:main"
